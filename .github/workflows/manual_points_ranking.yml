name: Manual Tournament Points Ranking

on:
push:
paths:
- 'scripts/manual/tournament_points_ranking.py'

jobs:
run-ranking:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install dependencies
    run: |
      pip install requests

  - name: Run script
    run: |
      python scripts/manual/tournament_points_ranking.py
```
