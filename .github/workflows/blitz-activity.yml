name: Blitz Activity Leaderboard

on:
  schedule:
    # Alle 6 Stunden (UTC). Passe das bei Bedarf an.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      perf_type:
        description: "Modus/Variante (blitz, rapid, bullet, classical, ultraBullet, chess960, crazyhouse, antichess, atomic, horde, kingOfTheHill, racingKings, threeCheck)"
        required: false
        default: "blitz"
        type: string

# Damit der Job am Ende per "git push" ins Repo schreiben darf.
permissions:
  contents: write

concurrency:
  # Verhindert, dass zwei Läufe gleichzeitig laufen und sich beim Commit
  # gegenseitig in die Quere kommen.
  group: blitz-activity
  cancel-in-progress: false

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true  # noetig, damit "git push" aus dem Skript heraus funktioniert

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Git-Identität einrichten
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Skript ausführen (pusht selbst laufend Live-Updates)
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
          # Beim Cron-Trigger (schedule) gibt es keine "inputs" - dann
          # greift der Fallback "blitz". Bei manuellem Start
          # (workflow_dispatch) kannst du den Modus im "Run workflow"-
          # Dialog auswaehlen.
          PERF_TYPE: ${{ github.event.inputs.perf_type || 'blitz' }}
        run: python3 scripts/auto/most_active_blitz_players.py

      - name: Debug – prüfen, was tatsächlich erzeugt wurde
        run: |
          echo "Inhalt des Repo-Root:"
          ls -la
          echo ""
          echo "Inhalt von data/ (falls vorhanden):"
          find data/ 2>&1 || echo "data/ existiert nicht!"
          echo ""
          echo "Inhalt von status/ (falls vorhanden):"
          find status/ 2>&1 || echo "status/ existiert nicht!"
          echo ""
          echo "Git-Status:"
          git status --porcelain --ignored

      - name: Letzten Rest committen (Sicherheitsnetz)
        run: |
          # Das Skript pusht waehrend des Laufs bereits selbst laufend.
          # Dieser Schritt fängt nur noch den allerletzten Rest ab, falls
          # zwischen dem letzten Live-Push im Skript und Skriptende noch
          # etwas Uncommittetes uebrig blieb.
          # "data/" und "status/" komplett hinzufuegen (nicht einzelne
          # Dateinamen), damit das fuer JEDEN PERF_TYPE-Unterordner
          # funktioniert, egal welcher Modus in diesem Lauf aktiv war.
          git add -f --ignore-errors data/ status/
          if git diff --staged --quiet; then
            echo "Keine Änderungen - nichts zu committen."
          else
            git pull --rebase
            git commit -m "Update ${PERF_TYPE:-blitz}-Leaderboard (final) [skip ci]"
            git push
          fi
